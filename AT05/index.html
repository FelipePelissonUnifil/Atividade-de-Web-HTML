<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulário de Cadastro</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    background-color:#f4f4f4;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    background:white;
    width:100%;
    max-width:600px;
    padding:30px;
    border-radius:15px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

h1{
    text-align:center;
    margin-bottom:20px;
    color:#333;
}

.campo{
    margin-bottom:15px;
}

label{
    display:block;
    margin-bottom:5px;
    font-weight:bold;
}

input[type="text"],
input[type="email"],
input[type="password"],
input[type="date"],
select,
textarea,
input[type="file"]{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:8px;
}

input:focus,
select:focus,
textarea:focus{
    outline:none;
    border:2px solid #007bff;
    background-color:#eef6ff;
}

.grupo{
    margin-top:10px;
}

textarea{
    resize:vertical;
}

.botoes{
    display:flex;
    gap:10px;
    justify-content:center;
    margin-top:20px;
}

button{
    padding:10px 20px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#007bff;
    color:white;
    transition:0.3s;
}

button:hover{
    background:#0056b3;
}

.reset{
    background:#dc3545;
}

.reset:hover{
    background:#a71d2a;
}

@media(max-width:600px){
    .container{
        margin:15px;
    }

    .botoes{
        flex-direction:column;
    }
}

</style>
</head>
<body>

<div class="container">

<h1>Formulário de Cadastro</h1>

<form>

    <div class="campo">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required>
    </div>

    <div class="campo">
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required>
    </div>

    <div class="campo">
        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" required>
    </div>

    <div class="campo">
        <label for="data">Data de Nascimento:</label>
        <input type="date" id="data" name="data">
    </div>

    <div class="campo">
        <label for="curso">Curso:</label>
        <select id="curso" name="curso">
            <option>Selecione</option>
            <option>Análise e Desenvolvimento de Sistemas</option>
            <option>Ciência da Computação</option>
            <option>Engenharia de Software</option>
            <option>Sistemas de Informação</option>
        </select>
    </div>

    <div class="campo">
        <label>Sexo:</label>

        <div class="grupo">
            <input type="radio" id="masculino" name="sexo">
            <label for="masculino">Masculino</label>

            <input type="radio" id="feminino" name="sexo">
            <label for="feminino">Feminino</label>

            <input type="radio" id="outro" name="sexo">
            <label for="outro">Outro</label>
        </div>
    </div>

    <div class="campo">
        <label>Interesses:</label>

        <div class="grupo">
            <input type="checkbox" id="programacao">
            <label for="programacao">Programação</label>

            <input type="checkbox" id="banco">
            <label for="banco">Banco de Dados</label>

            <input type="checkbox" id="web">
            <label for="web">Desenvolvimento Web</label>
        </div>
    </div>

    <div class="campo">
        <label for="comentarios">Comentários:</label>
        <textarea id="comentarios" rows="5"></textarea>
    </div>

    <div class="campo">
        <label for="foto">Upload de Foto:</label>
        <input type="file" id="foto">
    </div>

    <div class="botoes">
        <button type="submit">Enviar</button>
        <button type="reset" class="reset">Limpar</button>
    </div>

</form>

</div>

</body>
</html>
